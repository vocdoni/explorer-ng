name: Deploy to Netlify

# Single deploy target for every environment, mirroring vocdoni.io's setup: the Netlify site and
# every build-time value come from the GitHub environment selected below, so this file never
# hardcodes a site:
#
#   push to `lts`  -> `production`    -> the stable explorer (LTS gateway)
#   push to `main` -> `develop`       -> dev site (a production deploy of *that* site)
#   pull request   -> `pull request`  -> preview deploy on the preview site
#
# Each environment must define:
#   variables NETLIFY_SITE_ID, NETLIFY_SITE_NAME
#   variables VOCONE_API_URL, VOCONE_REFRESH_MS (optional; the app falls back to the public
#             LTS gateway and a 15s poll when unset)
# NETLIFY_AUTH_TOKEN is a repository-wide secret. The site id is deliberately a variable, not a
# secret: a Netlify site's API id is not sensitive, and variables are visible in run logs, which
# makes a deploy-to-the-wrong-site mistake diagnosable.

on:
  push:
    branches:
      - lts
      - main
  pull_request:
    branches:
      - lts
      - main

concurrency:
  # Never cancel a branch deploy midway; superseded PR previews are worth cancelling.
  group: netlify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # Needed by the deploy step to post the preview link back as a PR comment and
  # to record the deployment. Commit comments are deliberately left off (see the
  # deploy step) so that `contents` can stay read-only on a job that also runs
  # for pull requests.
  pull-requests: write
  deployments: write

jobs:
  deploy:
    # Dependabot-triggered runs never receive Actions secrets or the
    # environment-scoped variables this job builds and deploys with (Dependabot
    # only sees its own separate secrets store), so the whole job is skipped
    # rather than left to fail on empty credentials. A dependency bump doesn't
    # need a deploy preview.
    if: github.actor != 'dependabot[bot]'

    runs-on: ubuntu-latest

    # Selects which variables the job sees (see the header comment for the mapping and the
    # required configuration). Environment variables are only injected into a job that names
    # its environment, so without this every `vars.*` below resolves to empty.
    environment:
      name: ${{ github.event_name == 'pull_request' && 'pull request' || (github.ref_name == 'lts' && 'production' || 'develop') }}
      url: ${{ steps.deploy.outputs.deploy-url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Must precede setup-node: `cache: 'pnpm'` shells out to `pnpm store path`
      # to locate the cache directory, so pnpm has to already be on PATH. With
      # no `version` input the action installs whatever package.json's
      # "packageManager" field pins, keeping CI on the same pnpm as local dev.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.22.3'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Ahead of the build so a PR that breaks types or the legacy-URL redirect
      # table fails its check rather than shipping a green deploy preview.
      - name: Lint and typecheck
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build project
        run: pnpm build
        env:
          # Vite's `envPrefix` (see vite.config.ts) exposes these to the bundle.
          # They come from the environment selected above, so each site is built
          # against its own gateway and a preview keeps pointing at the dev
          # gateway even after the same commit is rebuilt for a branch.
          VOCONE_API_URL: ${{ vars.VOCONE_API_URL }}
          VOCONE_REFRESH_MS: ${{ vars.VOCONE_REFRESH_MS }}

      - name: Deploy to Netlify
        id: deploy
        uses: nwtgck/actions-netlify@v4.0
        with:
          publish-dir: './dist'
          # The branch whose pushes are production deploys *for the selected site*. Following the
          # pushed ref makes every branch push a production deploy of whichever site its
          # environment points at (main is "production" on the dev site, lts on the stable one).
          # On a pull_request run the workflow sits on the PR merge ref, which never matches, so
          # PRs always get preview deploys.
          production-branch: ${{ github.event_name == 'pull_request' && 'main' || github.ref_name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: 'Deploy from GitHub Actions'
          enable-pull-request-comment: true
          overwrites-pull-request-comment: true
          # Names the action's GitHub deployment record after the Netlify site it went to, so
          # deploys to the two sites stay distinguishable in the repository's deployments view.
          github-deployment-environment: ${{ vars.NETLIFY_SITE_NAME }}
          # Creating a commit comment needs `contents: write`, which this job
          # does not have. On a PR it would only duplicate the comment above,
          # and on a branch the GitHub deployment record already carries the URL.
          enable-commit-comment: false
          # Without this the action treats absent credentials as "nothing to do"
          # and the step passes green having deployed nothing, which is
          # indistinguishable from a successful deploy at a glance.
          fails-without-credentials: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
        timeout-minutes: 10
