name: Deploy to Netlify

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Superseded runs deploy previews nobody will look at, so drop them as soon as a
# newer commit lands on the same ref.
concurrency:
  group: netlify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Needed by the deploy step to post the preview link back as a PR comment and
  # to record the deployment. Commit comments are deliberately left off (see the
  # deploy step) so that `contents` can stay read-only on a job that also runs
  # for pull requests.
  pull-requests: write
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Selects which VOCONE_* variables the build below sees: PRs build against
    # the dev gateway, main against the production one. Environment variables
    # are only injected into a job that names its environment, so without this
    # `vars.VOCONE_API_URL` resolves to empty and every build silently falls
    # back to the hardcoded default in src/contexts/ApiContext.tsx.
    # The Netlify credentials are repository secrets, so they are unaffected.
    environment: "${{ github.event_name == 'pull_request' && 'pull request' || 'production' }}"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Must precede setup-node: `cache: 'pnpm'` shells out to `pnpm store path`
      # to locate the cache directory, so pnpm has to already be on PATH. With
      # no `version` input the action installs whatever package.json's
      # "packageManager" field pins, keeping CI on the same pnpm as local dev.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.22.3'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Ahead of the build so a PR that breaks types or the legacy-URL redirect
      # table fails its check rather than shipping a green deploy preview.
      - name: Lint and typecheck
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build project
        run: pnpm build
        env:
          # Vite's `envPrefix` (see vite.config.ts) exposes these to the bundle.
          # They come from the environment selected above, so the gateway is
          # baked in at build time and a preview keeps pointing at the dev
          # gateway even after the same commit is rebuilt for main. Both are
          # optional: src/contexts/ApiContext.tsx falls back to the public LTS
          # gateway and a 15s poll when unset.
          VOCONE_API_URL: ${{ vars.VOCONE_API_URL }}
          VOCONE_REFRESH_MS: ${{ vars.VOCONE_REFRESH_MS }}

      - name: Deploy to Netlify
        # Dependabot-triggered runs never receive Actions secrets (they only see
        # the separate Dependabot secrets store), so NETLIFY_AUTH_TOKEN/SITE_ID
        # come up empty and fails-without-credentials turns that into a hard
        # failure. A dependency bump doesn't need a deploy preview anyway, so
        # skip the deploy and let the build above act as the CI check.
        if: github.actor != 'dependabot[bot]'
        uses: nwtgck/actions-netlify@v4.0
        with:
          publish-dir: './dist'
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: 'Deploy from GitHub Actions'
          enable-pull-request-comment: true
          overwrites-pull-request-comment: true
          # Creating a commit comment needs `contents: write`, which this job
          # does not have. On a PR it would only duplicate the comment above,
          # and on main the GitHub deployment record already carries the URL.
          enable-commit-comment: false
          # Without this the action treats absent credentials as "nothing to do"
          # and the step passes green having deployed nothing, which is
          # indistinguishable from a successful deploy at a glance.
          fails-without-credentials: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 10
