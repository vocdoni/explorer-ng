name: explorer-ng

services:
  explorer:
    build:
      context: .
      dockerfile: Dockerfile
    image: vocdoni/explorer-ng:latest
    container_name: explorer-ng
    # Optional so a fresh checkout without a .env still starts on the defaults
    # below. Copy .env.example to .env to override them.
    env_file:
      - path: .env
        required: false
    environment:
      VOCONE_API_URL: ${VOCONE_API_URL:-https://api.vocdoni.io/v2}
      VOCONE_REFRESH_MS: ${VOCONE_REFRESH_MS:-15000}
    ports:
      - '${EXPLORER_PORT:-8080}:80'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
