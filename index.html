<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vocdoni Explorer</title>
    <meta
      name="description"
      content="Explore organizations, elections, votes, blocks and validators on the Vocdoni voting blockchain, and verify individual ballots."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script src="/runtime-config.js"></script>
    <style>
      /* Base-layer rules from the vocdoni.io reference that sit below the
         Chakra theme: text polish, and a global reduced-motion collapse. */
      body {
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        text-wrap: pretty;
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
